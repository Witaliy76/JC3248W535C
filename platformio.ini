; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:yoradio-esp32s3]
; ЗАФИКСИРОВАННЫЕ ВЕРСИИ ДЛЯ СТАБИЛЬНОЙ КОМПИЛЯЦИИ
; ================================================
; platform: espressif32@6.4.0 - стабильная версия PlatformIO для ESP32
; framework: arduino-esp32@2.0.17 - поддерживает ADC_ATTEN_DB_12
; Arduino_GFX: локальная версия 1.6.0 - совместима с ESP32 Core 2.x
platform = espressif32@6.4.0
board = ESP32-S3-DevKitC-1
framework = arduino
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
platform_packages = 
    framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32.git#2.0.17

; ЗАБЛОКИРОВАННЫЕ ЗАВИСИМОСТИ (НЕ РАСКОММЕНТИРОВАТЬ!)
; =================================================
; Эти зависимости закомментированы для предотвращения автоматического скачивания
; несовместимых версий библиотек
; lib_deps = 
;     https://github.com/moononournation/Arduino_GFX.git

build_flags = 
	-DBOARD_HAS_PSRAM
	-DARDUINO_RUNNING_CORE=1
	-DARDUINO_EVENT_RUNNING_CORE=1
	-DAUDIOTASK_CORE=0
	-DCONFIG_SPIRAM_SUPPORT=1
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DCONFIG_FREERTOS_USE_TRACE_FACILITY=1
	-DCONFIG_ESP32S3_DEFAULT_CPU_FREQ_240=1
	-DCONFIG_FREERTOS_GENERATE_RUN_TIME_STATS=1
	-DCONFIG_FREERTOS_USE_TRACE_FACILITY=1
	-DCONFIG_FREERTOS_USE_STATS_FORMATTING_FUNCTIONS=1
	-I src/src/GFX_Library_for_Arduino/src
	-I src/src/GFX_Library_for_Arduino/src/canvas
	-I src/src/Perfmon
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = partitions.csv
upload_protocol = esptool
